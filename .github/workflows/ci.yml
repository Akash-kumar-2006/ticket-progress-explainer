name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend:
    name: Backend tests and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and validate the synthetic dataset
        run: |
          python -m scripts.generate_dataset
          python -m scripts.validate_dataset
          python -m scripts.generate_evaluation_cases

      - name: Seed the database
        run: python -m scripts.seed_database

      - name: Run the full pytest suite
        # Includes the grounding/refusal gate, the next-action lexicon tests,
        # the role-security tests and the human-evaluation framework tests.
        run: python -m pytest -o addopts="" -q

      - name: Verify the next-action evaluation still runs
        run: python -m scripts.measure_next_action

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
